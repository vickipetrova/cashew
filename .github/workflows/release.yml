name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      # Pinned to a commit rather than a tag — see the note in build.yml. It matters more here,
      # where the token can write.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `VERSION` in build.sh is what lands in CFBundleVersion / CFBundleShortVersionString, and
      # nothing ties it to the tag. Tagging v0.2.0 on a commit where build.sh still says 0.1.0
      # would otherwise draft a perfectly healthy release of an app that reports the old version —
      # a mismatch nobody sees until a user reads About. First step, so it fails in seconds.
      - name: Check the tag matches VERSION in build.sh
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^VERSION="\(.*\)"/\1/p' build.sh)"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag is $GITHUB_REF_NAME but build.sh has VERSION=\"$VERSION\" (expected tag v$VERSION). Bump VERSION, or delete and re-cut the tag — see docs/RELEASING.md."
            exit 1
          fi
          echo "OK — tag $GITHUB_REF_NAME matches VERSION $VERSION."

      # build.yml never runs on tags, so nothing else stands between a broken commit and a drafted
      # release — the tag is often the first time that commit is built at all. Same --disable-xctest
      # as build.yml: the runner has full Xcode, so without it an `import XCTest` sails through here
      # while being unbuildable for the Command Line Tools contributors this project targets.
      - name: Test
        run: swift test --disable-xctest

      - name: Build app + DMG
        run: ./build.sh --dmg

      # The filename carries the version, so this also catches build.sh and the tag disagreeing in
      # a way the check above could not — that one compares the tag to VERSION, this one confirms
      # the file VERSION actually produced is the file we are about to attach.
      - name: Verify the DMG
        run: test -f "build/Cashew-${GITHUB_REF_NAME#v}.dmg"

      # The DMG from CI is ad-hoc signed, not notarized — CI never sees a Developer ID. The release
      # is created as a DRAFT so the maintainer can sign, notarize, and staple locally
      # (docs/RELEASING.md), replace the asset, and then publish.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "${GITHUB_REF_NAME}" \
            --notes "Draft. Replace the attached DMG with a signed + notarized build before publishing — see docs/RELEASING.md. Release notes: see CHANGELOG.md." \
            "build/Cashew-${GITHUB_REF_NAME#v}.dmg"
