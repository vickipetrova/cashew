name: build

on:
  push:
    branches: [main]
  pull_request:

# This workflow only reads. The repository default is already read-only, but that default is a
# settings toggle rather than something in the repo, and this workflow runs on `pull_request` — which
# means it runs against code from forks. Declaring the scope here means a change to that toggle can't
# silently hand a write token to a fork's build.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # Pinned to a commit rather than a tag: a tag can be moved to point at different code, a commit
      # SHA can't. Dependabot understands this form and updates the SHA and the comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --disable-xctest enforces the project's toolchain contract. The Command Line Tools ship
      # Testing.framework but not XCTest.framework, so an `import XCTest` would compile here (the
      # runner has full Xcode) while being unrunnable for anyone building with CLT alone.
      - name: Test
        run: swift test --disable-xctest

      - name: Build
        run: ./build.sh

      - name: Verify the app bundle
        run: |
          set -euo pipefail
          test -f "build/Cashew.app/Contents/Info.plist"
          # The app and the Claude Code hook helper get the same checks: the helper is run by Claude
          # Code on every tool call, so a single-arch or 10.13 helper breaks sessions, not just Cashew.
          for BIN in build/Cashew.app/Contents/MacOS/Cashew \
                     build/Cashew.app/Contents/Helpers/cashew-hook; do
            test -x "$BIN"
            # Must be a universal binary — a single-arch slice means the lipo step silently regressed.
            lipo -info "$BIN" | tee /dev/stderr | grep -q "arm64"
            lipo -info "$BIN" | grep -q "x86_64"
            # `platforms:` in Package.swift is the only thing pinning the deployment target now, and a
            # typo there ships a macOS 10.13 binary that would pass every check above.
            test "$(otool -l "$BIN" | grep -c 'minos 13.0')" -eq 2
            # `swift build -c release` compiles with -g by default; without -debug-info-format none the
            # binary carries a debug map full of absolute paths from the build machine.
            test "$(nm -a "$BIN" | grep -c OSO)" -eq 0
          done
          # Everything above passes just as well on a bundle macOS won't start. The signature is the
          # property that actually gates launch on Apple Silicon, and nothing else here looks at it.
          codesign --verify --strict --verbose build/Cashew.app

      - name: Verify the app icon
        run: |
          set -euo pipefail
          RES="build/Cashew.app/Contents/Resources"
          PLIST="build/Cashew.app/Contents/Info.plist"

          # Tier 1 is unconditional: it uses only sips and iconutil, both of which are in /usr/bin,
          # so a missing .icns here means the icon step broke rather than that a toolchain was absent.
          test -f "$RES/Cashew.icns"
          test "$(plutil -extract CFBundleIconFile raw "$PLIST")" = "Cashew"
          # Existing is not the same as usable — iconutil round-tripping it is what proves the file is
          # a real icon family and not, say, a copied PNG.
          iconutil -c iconset "$RES/Cashew.icns" -o /tmp/icon-check.iconset
          test "$(ls /tmp/icon-check.iconset | wc -l | tr -d ' ')" -eq 10
          # The trap this whole step exists for: `assets/icon-1024.png` must be a render that already
          # sits on Apple's grid (assets/render-icon.sh produces one, ~83% of the tile). Replacing it
          # with a full-bleed Icon Composer export — the obvious thing to do, since that is what the
          # app's File ▸ Export gives you — reads as 100% here and would ship an icon a quarter too
          # large on macOS 13-15, which draw the .icns as authored. macOS 26 re-masks legacy .icns
          # content into the system tile, so this regression is invisible on a current Mac: measured,
          # inset and full-bleed bundles render to an identical 83.59% bbox there. This assertion is
          # the only thing that catches it.
          #
          # In Swift because this needs a pixel, and sips cannot report one: `hasAlpha` only says the
          # channel exists, and there is no maxAlpha property. Swift is already a hard requirement of
          # this job, so it costs nothing that `swift build` above has not already paid for.
          test "$(sips -g pixelWidth /tmp/icon-check.iconset/icon_512x512@2x.png | tail -1 | awk '{print $2}')" -eq 1024
          cat > /tmp/icon-inset-check.swift <<'SWIFT'
          import AppKit
          let path = CommandLine.arguments[1]
          guard let src = CGImageSourceCreateWithURL(URL(fileURLWithPath: path) as CFURL, nil),
                let img = CGImageSourceCreateImageAtIndex(src, 0, nil) else {
              FileHandle.standardError.write(Data("cannot read \(path)\n".utf8)); exit(1)
          }
          let n = img.width
          var px = [UInt8](repeating: 0, count: n * n * 4)
          let ctx = CGContext(data: &px, width: n, height: n, bitsPerComponent: 8, bytesPerRow: n * 4,
                              space: CGColorSpace(name: CGColorSpace.sRGB)!,
                              bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue)!
          ctx.draw(img, in: CGRect(x: 0, y: 0, width: n, height: n))
          var minX = n, maxX = -1
          for y in 0..<n { for x in 0..<n where px[(y * n + x) * 4 + 3] > 8 {
              minX = min(minX, x); maxX = max(maxX, x) } }
          let ratio = Double(maxX - minX + 1) / Double(n)
          print("icon \(n)px: artwork spans \(maxX - minX + 1)px (\(Int(ratio * 100))% of the tile)")
          guard ratio > 0.70, ratio < 0.90 else {
              FileHandle.standardError.write(Data(
                  "error: artwork spans \(Int(ratio * 100))% of the tile; expected ~80% (Apple's 824/1024 grid).\n".utf8))
              exit(1)
          }
          SWIFT
          swift /tmp/icon-inset-check.swift /tmp/icon-check.iconset/icon_512x512@2x.png

          # Tier 2 is optional by design, so mirror build.sh's own guard rather than assuming. The
          # macos-latest runner ships Xcode, so in practice this arm does run and gives the layered
          # icon real regression coverage.
          if xcrun --find actool >/dev/null 2>&1; then
            test -f "$RES/Assets.car"
            test "$(plutil -extract CFBundleIconName raw "$PLIST")" = "Cashew"
            echo "OK — .icns and the layered Assets.car are both present."
          else
            # Claiming a layered icon that isn't in the bundle is the failure this catches. Written as
            # an if/exit rather than `! plutil …`: bash exempts a command whose status is inverted with
            # `!` from set -e, so the bare form is inert and this arm would pass on exactly the bundle
            # it exists to reject.
            if plutil -extract CFBundleIconName raw "$PLIST" >/dev/null 2>&1; then
              echo "::error::CFBundleIconName is set but actool was unavailable, so no Assets.car was built."
              exit 1
            fi
            echo "OK — .icns present; actool unavailable, layered icon correctly skipped."
          fi

      - name: Check nothing logs the token
        run: |
          set -euo pipefail
          # Cheap guard against the one mistake that actually matters here: flag any print/NSLog
          # whose argument mentions a token. Comment lines are excluded — the files that handle the
          # token describe in prose that they never log it, and that prose is not a violation.
          hits="$(grep -rnE '(print|NSLog|debugPrint|os_log|FileHandle\.standardError)[^\n]*[Tt]oken' Sources/ Tests/ \
                  | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*)' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Source appears to log a token. See the guardrails in CLAUDE.md."
            exit 1
          fi
          echo "OK — no token logging found."

      - name: Check tests touch nothing they shouldn't
        run: |
          set -euo pipefail
          # These reach the developer's real login, their real login items, the network, or the
          # window server. See "Never called from a test" in CLAUDE.md for why each is here.
          # UsageHistory.default is the newest: it writes into the running app's own Application
          # Support folder. Tests pass a temp directory, and the location is a constructor parameter
          # rather than a constant precisely so that stays enforceable from here.
          # HookInstaller.default edits the real ~/.claude/settings.json; SessionActivity.default and
          # SessionFiles.defaultDirectory are the running app's sessions; UpdateCheck.fetch is the
          # network. Credentials.keychainItemExists/fileExists read the real login; loginExists
          # calls both, so it joins them here too rather than only its two halves.
          hits="$(grep -rnE 'MenuController\(|AppDelegate\(|accessToken\(|launchAtLogin|UNUserNotificationCenter|ClaudeProvider\(\)\.fetch|UsageHistory\.default|StatuslineFeed\.default|HookInstaller\.default|SessionActivity\.default|SessionFiles\.defaultDirectory|UpdateCheck\.fetch|Credentials\.(keychainItemExists|fileExists|loginExists)' Tests/ \
                  | grep -vE '^[^:]+:[0-9]+:[[:space:]]*(//|\*|///)' || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A test references an API that reads real credentials, registers a login item, hits the network, writes real app state, or needs a GUI session."
            exit 1
          fi
          echo "OK — tests stay in bounds."
